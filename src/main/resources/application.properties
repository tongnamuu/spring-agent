spring.application.name=spring-agent
spring.ai.model.chat=ollama
spring.ai.model.embedding=ollama
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${OLLAMA_MODEL:llama3.1:8b}
spring.ai.ollama.embedding.model=${OLLAMA_EMBEDDING_MODEL:qwen3-embedding:0.6b}
spring.elasticsearch.uris=${ELASTICSEARCH_URIS:http://localhost:9200}
spring.ai.vectorstore.elasticsearch.initialize-schema=true
spring.ai.vectorstore.elasticsearch.index-name=${RAG_INDEX_NAME:spring-agent-knowledge}
spring.ai.vectorstore.elasticsearch.dimensions=${RAG_EMBEDDING_DIMENSIONS:1024}
spring.ai.vectorstore.elasticsearch.similarity=cosine
spring.rag.search.top-k=${RAG_SEARCH_TOP_K:5}
spring.rag.search.candidate-multiplier=${RAG_SEARCH_CANDIDATE_MULTIPLIER:2}
spring.rag.search.similarity-threshold=${RAG_SEARCH_SIMILARITY_THRESHOLD:0.35}
